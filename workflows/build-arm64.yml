
name: Build TrustTunnel ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ARM64 OCI image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --output type=oci,dest=trusttunnel-endpoint-arm64.tar \
            -t trusttunnel-endpoint:arm64 .

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: trusttunnel-endpoint-arm64
          path: trusttunnel-endpoint-arm64.tar
